[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "compiler-centric-kernel-optimization"
version = "0.5.0"
description = "Hosted-API GPU kernel source optimization with analytical modeling and selective hardware feedback."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Sijin" },
]
dependencies = []

[project.scripts]
kernel-opt = "kernel_optimization.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
